<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Sistema de Estoque</span>
            <div class="d-flex text-white align-items-center">
                <button id="btnGerenciarUsuarios" class="btn btn-sm btn-outline-light me-3 d-none">Gerenciar Usuários</button>
                <span id="nomeUsuario" class="me-3"></span>
                <button id="btnSair" class="btn btn-sm btn-danger">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            
            <div class="col-md-4" id="areaCadastro">
                <div class="card p-3 shadow-sm mb-3">
                    <h5>Cadastrar Produto</h5>
                    <form id="formProduto">
                        <input type="text" id="prodNome" class="form-control mb-2" placeholder="Nome" required>
                        <input type="number" id="prodPreco" class="form-control mb-2" placeholder="Preço (R$)" step="0.01" required>
                        <input type="number" id="prodQtd" class="form-control mb-2" placeholder="Qtd Inicial" required>
                        <button type="submit" class="btn btn-success w-100">Salvar Produto</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                
                <div class="row mb-3">
                    <div class="col-md-8">
                        <input type="text" id="buscaProduto" class="form-control" placeholder="Buscar produto pelo nome...">
                    </div>
                    <div class="col-md-4">
                        <select id="ordenaProduto" class="form-select">
                            <option value="">Ordenar por...</option>
                            <option value="az">Ordem Alfabética (A-Z)</option>
                            <option value="menorPreco">Menor Preço</option>
                            <option value="maiorPreco">Maior Preço</option>
                        </select>
                    </div>
                </div>

                <div class="card p-3 shadow-sm">
                    <h5>Estoque Atual</h5>
                    <table class="table table-striped mt-2">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produto</th>
                                <th>Preço</th>
                                <th>Qtd</th>
                                <th>Ação (Vender)</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos">
                            </tbody>
                    </table>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="js/painel.js"></script>
</body>
</html>
